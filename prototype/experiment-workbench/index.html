 if(schema.type&&!types[schema.type])return [path+' 必须是 '+schema.type];
 const errors=[];
 if(schema.type==='object'){
  for(const key of schema.required||[])if(!Object.hasOwn(value,key))errors.push(path+'.'+key+' 为必填字段');
  for(const key of Object.keys(value)){
   if(schema.properties?.[key])errors.push(...schemaErrors(value[key],schema.properties[key],path+'.'+key));
   else if(schema.additionalProperties===false)errors.push(path+'.'+key+' 不属于返回格式');

 if(schema.pattern&&!new RegExp(schema.pattern).test(value))errors.push(path+' 须为十进制 ID 字符串');

}

" rx="91" ry="3"/><ellipse cx="342" cy="393" rx="48" ry="2"/></g>${warm?`<ellipse cx="500" cy="135" rx="${variant===1?260:160}" ry="200" fill="url(#${uid}l)"/>`:''}<rect x="1" y="1" width="638" height="438" fill="none" stroke="#1b3c2c" stroke-opacity=".12"/></svg>`;
}

 }
 return `<aside class="sidebar"><div class="sidebar-head"><div class="row between"><h3>当前工作的分支</h3><small>共 ${list.length} 条</small></div></div><div class="branch-list" role="tree" aria-label="当前工作分支树">${list.filter(b=>!parentBranch(b)).map(b=>node(b,0)).join('')}</div><div class="sidebar-foot">${btn('查看分支图','graph','','','grid')}</div></aside>`;

function workbenchHead(title,desc,action=''){return `<div class="workbench-head"><div class="row between"><h1>${esc(title)}</h1>${action}</div>${desc?`<p>${esc(desc)}</p>`:''}</div>`;}
function runCard(run,comparing=false){

function experienceSnapshot(e){
 const evidence=[...(e.evidence||[]).map(run_id=>({run_id,generation_task_id:runById(run_id)?.task||null,role:'supporting_evidence'})),...(e.counter||[]).map(run_id=>({run_id,generation_task_id:runById(run_id)?.task||null,role:'counterexample'}))];
 return {experience_id:e.id,title:e.title,conditions:e.conditions,note:e.note,provenance:{created_by_task_id:e.task||null,evidence}};
}
function experienceKnowledge(e){return `<div class="experience-knowledge">${inputReadout('适用条件',e.conditions)}${inputReadout('经验结论',e.note)}</div>`;}

function currentInputs(){return S.inspectRun&&selectedRun()?selectedRun().inputs:activeExperiment()?.initialInputs||branch().draft;}
function inputsLocked(){return S.inspectRun||!!activeExperiment();}
function catalogItem(id){return CATALOG.find(item=>item.id===id);}
function kindLabel(kind){return CATALOG_KINDS.find(item=>item.id===kind).label;}
function resourceCompatible(item,inputs){return (!item.base||item.base===inputs.model)&&(!item.modelIds?.length||item.modelIds.includes(inputs.checkpoint));}
function resourceSelected(item,inputs=currentInputs()){
  if(item.kind==='model')return inputs.checkpoint===item.id;
  if(item.kind==='comfyui-template')return inputs.template===item.id;
  if(item.kind==='lora')return inputs.loras.some(l=>l.id===item.id);
  return false;
 }
function selectedResources(inputs){return [inputs.checkpoint,inputs.template,...inputs.loras.map(l=>l.id)].filter(Boolean).map(catalogItem).filter(Boolean);}
function incompatibleResources(item,inputs){
  const target={...inputs,model:item.base,checkpoint:item.id};
  return selectedResources(inputs).filter(x=>x.kind!=='model'&&!resourceCompatible(x,target));
 }
function applyResourceChoice(inputs,item,toggle=false){
 const id=item.id;
 if(item.kind==='model'){
  inputs.model=item.base;inputs.checkpoint=id;
  if(inputs.template&&!resourceCompatible(catalogItem(inputs.template),inputs))inputs.template=null;
  inputs.loras=inputs.loras.filter(l=>resourceCompatible(catalogItem(l.id),inputs));
 }else{
  if(!resourceCompatible(item,inputs))return false;
  if(item.kind==='comfyui-template')inputs.template=id;
  else if(item.kind==='lora'){
   if(resourceSelected(item,inputs)){if(toggle)inputs.loras=inputs.loras.filter(l=>l.id!==id);}
   else inputs.loras.push({id,weight:item.weight});
  }
 }
 return true;
}
function chooseResource(id){
 if(inputsLocked())return;
 const item=catalogItem(id),b=branch();
 if(!applyResourceChoice(b.draft,item,true))return;

 touchDraft(b);persist();render();
}
function openCatalog(kind){
  S.page='resources';S.catalog.kind=kind;S.catalog.base=branch().draft.model;S.catalog.model='';
  S.catalog.query='';S.catalog.page=1;S.catalog.detail=null;S.catalog.gallery=null;S.compare=null;persist();render();
 }
function resourceAction(item,inputs){
  const selected=resourceSelected(item,inputs),compatible=item.kind==='model'||resourceCompatible(item,inputs),multiple=!['model','comfyui-template'].includes(item.kind);
  const label=!compatible?'需更换生成模型':selected?(multiple?'移除':'已选择'):'选择';
  return btn(label,'resource-select',`data-id="${item.id}" aria-label="${label} ${esc(item.name)}" aria-pressed="${selected}" ${inputsLocked()||!compatible||selected&&!multiple?'disabled':''}`,selected?'small':'small primary');
 }

function handleCatalogAction(a,d){

 }

 }else if(a==='catalog-kind'){c.kind=d.kind;c.query='';c.page=1;c.detail=null;c.gallery=null;}

 persist();render();return true;
}

function publishTaskArtifact(taskId,artifact){
 const t=S.tasks.find(t=>t.id===taskId);
 if(t.readOnly)throw new Error('该历史任务仅供查看，请在当前分支创建任务。');
 const contract=t.taskInput.output_contract;
 const acceptedSchema=artifactSchema(contract.artifact_types).anyOf.find(schema=>schema.properties.type.const===artifact.type);
 const structuralErrors=acceptedSchema?schemaErrors(artifact,acceptedSchema):['artifact.type 不在本任务允许的产物类型中'];
 if(structuralErrors.length)throw new Error(structuralErrors.join('；'));
 const payload=artifact.type==='generation_input'?artifact:artifact.candidate;
 if(payload){
  const generated=payload.generation_input,template=CATALOG.find(item=>item.kind==='comfyui-template'&&item.sourceId===generated.template_id);
  if(generated.template_id&&!template)throw new Error('generation_input.template_id 未找到对应模板');
  if(generated.model&&!CATALOG.some(item=>item.kind==='model'&&item.sourceId===generated.model.id&&item.file===generated.model.file_name))throw new Error('generation_input.model 与目录记录不匹配');
  for(const [parameterId,value] of Object.entries(generated.parameters)){
   const imageParameter=template?.image_parameters.find(parameter=>parameter.id===parameterId);
   if(imageParameter){if(imageParameter.value_type==='string[]'?(!Array.isArray(value)||value.some(item=>typeof item!=='string')):typeof value!=='string')throw new Error('parameters.'+parameterId+' 的值类型与图片参数不符');continue;}
   const field=Object.entries(template?.parameterIds||{}).find(([,id])=>id===parameterId)?.[0];
   if(!field)throw new Error('parameters.'+parameterId+' 未在所选模板中声明');
   if(['seed','steps','cfg','width','height'].includes(field)?!Number.isFinite(value):typeof value!=='string')throw new Error('parameters.'+parameterId+' 的值类型与模板不符');
  }
  for(const item of generated.loras)if(!CATALOG.some(ref=>ref.kind==='lora'&&ref.sourceId===item.id&&ref.file===item.file_name))throw new Error('generation_input.loras 中的资源与目录不匹配');
 }
 for(const ref of artifact.refs||[])if(!CATALOG.some(item=>item.kind===ref.kind&&item.sourceId===ref.id))throw new Error('refs 中的资源不存在');
 const runIds=new Set([...t.input.evidence,...S.runs.filter(run=>run.task===t.id).map(run=>run.id)]);
 if((artifact.run_ids||[]).some(id=>!runIds.has(id)))throw new Error('run_ids 必须引用本次任务的证据或生成记录');
 t.deliveryError=null;
 if(artifact.type!=='question'&&!contract.artifact_types.includes(artifact.type))throw new Error('产物类型与任务要求不符。');
 if(artifact.type==='parameters'){
  const keys=catalogItem(t.input.inputs.template)?.parameterIds||{};
  for(const [id,value] of Object.entries(artifact.parameters)){
   if(!contract.parameter_ids.includes(id))throw new Error('参数未获得本任务的写入授权：'+id);
   const field=Object.keys(keys).find(key=>keys[key]===id);
   if(['seed','steps','cfg','width','height'].includes(field)?!Number.isFinite(value):typeof value!=='string')throw new Error('参数值类型与模板不符：'+id);
  }
 }
 const artifactId=t.id+'-A'+((t.artifacts?.length||0)+1);
 (t.artifacts??=[]).push({artifact_id:artifactId,artifact:clone(artifact),disposition:artifact.type==='question'?'waiting_input':'candidate'});
 if(artifact.type==='question'){t.status='waiting_input';t.question=artifact.question;t.questionArtifact=clone(artifact);t.questionArtifactId=artifactId;return;}

 t.artifact=clone(artifact);if(t.kind!=='experiment')t.status=contract.required_artifact_types.every(type=>t.artifacts.some(record=>record.artifact.type===type))?'succeeded':'running';t.disposition=t.kind==='experiment'?'recorded':'candidate';if(t.kind==='experiment')t.artifacts.at(-1).disposition='recorded';
}
function receiveTaskArtifact(text,sessionId){
 let payload;
 try{payload=JSON.parse(text);}catch{return {ok:false,errors:['返回内容必须是 JSON 对象']};}
 const envelopeErrors=schemaErrors(payload,schemaObject({task_id:textSchema,artifact:{type:'object'}}),'request');
 if(envelopeErrors.length)return {ok:false,errors:envelopeErrors};
 const t=S.tasks.find(item=>item.id===payload.task_id);
 if(!t)return {ok:false,errors:['task_id 未找到对应任务']};
 if(sessionId!==t.sessionId)return {ok:false,errors:['执行会话无权写入该 task_id']};
 try{
  publishTaskArtifact(t.id,payload.artifact);
  if(TASK_ACTIONS[t.kind].auto&&payload.artifact.type!=='question')applyTaskArtifact(t,false,payload.artifact);
  persist();render();if(modal?.kind==='evaluate'&&modal.id===t.input.evaluation?.run_id)renderOverlays();if(t.work===S.work&&S.page!=='tasks')toast(`${t.title}${t.status==='waiting_input'?'需要补充输入':t.disposition==='conflict'?'的结果待采用':'已完成'} · ${t.id}`,{taskId:t.id});return {ok:true,task_id:t.id,disposition:t.disposition};
 }catch(error){t.deliveryError=error.message;persist();render();return {ok:false,errors:[error.message]};}
}
function applyTaskArtifact(t,explicit=false,artifact=t.artifact){
 if(t.readOnly)return false;
 const b=S.branches.find(b=>b.id===t.branch),a=artifactForView(t,artifact);if(!a)return false;
 const record=t.artifacts?.findLast(item=>item.artifact.type===a.type);
 const conflict=reason=>{t.disposition='conflict';t.conflict=reason;if(record)record.disposition='conflict';return false;};
 if(['review','experience'].includes(a.type)&&t.input.evaluation){
  const draft=evaluationDraft(t.input.evaluation.run_id);
  if(!explicit&&JSON.stringify(evaluationBaseline(t,true))!==JSON.stringify(evaluationBaseline(t)))return conflict('evaluation');
  for(const key of evaluationFields(a.type))draft[key]=a[key];
  draft.evidence=clone(a.run_ids);draft[a.type==='experience'?'experienceTaskId':'reviewTaskId']=t.id;
 }else{
  if(S.experiments.some(e=>e.branch===b.id&&!S.tasks.find(task=>task.id===e.task)?.readOnly&&['running','paused'].includes(e.status)))return conflict('experiment');
  if(!explicit&&!draftMatches(b,t.input.baseline))return conflict('input');
  const candidate=clone(t.input.inputs);
  if(a.type==='resources'){
   const items=a.items.map(catalogItem);
   for(const item of items){
    if(item.kind==='model'){candidate.model=item.base;candidate.checkpoint=item.id;}
    else if(item.kind==='comfyui-template')candidate.template=item.id;
    else if(item.kind==='lora'){if(!candidate.loras.some(l=>l.id===item.id))candidate.loras.push({id:item.id,weight:item.weight});}
   }
   b.draft=candidate;
  }else if(a.type==='prompt'){b.draft={...candidate,prompt:a.positive_prompt,negative:a.negative_prompt};}
  else if(a.type==='parameters'||a.type==='generation_input'||a.inputs)b.draft=clone(a.inputs);
  else if(a.type==='experience'){
   const source=a.run_ids[0]&&runById(a.run_ids[0]);
   S.experiences.push({id:'e'+(S.experiences.length+1),work:t.work,branch:t.branch,title:a.title,conditions:a.conditions,note:a.note,model:candidate.model,evidence:clone(a.run_ids),counter:[],sourceRunId:source?.id||null,task:t.id});
  }
  if(['prompt','parameters','resources','generation_input'].includes(a.type)||a.inputs){touchDraft(b);b.draftTask=t.id;}
 }
 t.disposition='applied';t.conflict=null;if(record)record.disposition='applied';return true;

function tickTasks(){
  let changed=false;
  for(const t of S.tasks){
   if(t.kind==='run'){
    const runs=S.runs.filter(run=>run.task===t.id);if(!runs.length)continue;
    const status=runs.some(run=>run.status==='running')?'waiting_generation':runs.some(run=>run.status==='failed')?'failed':'succeeded';
    if(t.status!==status){t.status=status;changed=true;}continue;
   }
   if(t.kind==='experiment'){
    if(t.readOnly)continue;
    const e=S.experiments.find(e=>e.id===t.experiment);if(!e)continue;
    const status=e.status==='completed'?'succeeded':e.status==='stopped'?'interrupted':e.status==='paused'?'paused':e.active?'waiting_generation':'running';
    if(t.status!==status){t.status=status;changed=true;}
    continue;
   }
   if(t.readOnly||t.status!=='running')continue;
   const phase=Math.min(2,Math.floor((Date.now()-t.startedAt)/1500));
   if(t.phase!==phase){t.phase=phase;changed=true;}
   if(t.due>Date.now())continue;
   if(!t.artifacts?.some(item=>item.artifact.type===TASK_ACTIONS[t.kind].type))receiveTaskArtifact(JSON.stringify({task_id:t.id,artifact:artifactFixture(t)}),t.sessionId);
   changed=true;
  }
  return changed;
 }

function handleAgentAction(a,d){
  if(a==='agent-action'){
   const f=functionBinding(d.kind);
   if(!f)return toast('该功能已移除，请从当前页面重新选择。'),true;
   if(['run','experiment'].includes(f.kind)){
    const action=f.kind==='run'?'run':'start-agent',problem=validateExecution(action)||functionProblem(f.id);
    if(problem)return toast(problem),true;dispatch(action,{functionId:f.id});return true;
   }
   if(['review','compare','diagnose','experience'].includes(f.kind)){startTask(d.kind);return true;}
   showModal('agent-task',d.kind);return true;
  }
  if(!['task-interrupt','task-resume','task-apply','task-branch','task-inputs','task-evaluation','task-generation-apply'].includes(a))return false;
  const t=S.tasks.find(x=>x.id===d.id),b=S.branches.find(b=>b.id===t.branch);
  if(t.readOnly&&!['task-inputs','task-evaluation'].includes(a))return true;
  if(a==='task-interrupt')t.status='interrupted';
  if(a==='task-resume'){if(t.preset&&!presetById(t.preset.id))return toast('任务使用的预设已不可用，请在 Agent Studio 恢复该预设后继续。'),true;t.status='running';t.startedAt=Date.now();t.due=Date.now()+4500;t.phase=0;}
  if(a==='task-apply'){
   if(t.input.evaluation?JSON.stringify(evaluationBaseline(t,true))!==JSON.stringify(JSON.parse(d.expected)):!draftMatches(b,JSON.parse(d.expected)))return toast(t.input.evaluation?'评价与经验草稿已修改，请重新核对后填入。':'任务输入已修改，请重新核对后采用。'),true;
   if(!applyTaskArtifact(t,true))return toast(t.conflict==='experiment'?'请结束当前实验后，再采用产物。':t.artifact.type==='resources'?'推荐资源与当前生成模型不兼容，请重新推荐。':'当前模型或模板与生成输入产物不匹配，可从产物创建分支。'),true;
  }
  if(a==='task-evaluation'){showModal('evaluate',t.input.evaluation.run_id);return true;}
  if(a==='task-generation-apply'){
   if(!draftMatches(b,JSON.parse(d.expected)))return toast('任务输入已改变，请重新查看建议。'),true;
   b.draft=clone(artifactForView(t).inputs);touchDraft(b);b.draftTask=t.id;toast('已采用建议输入');
  }
  if(a==='task-branch'){
   const created=makeBranch(`${b.name} · ${t.title}`,t.input.sourceRunId,undefined,{goal:t.input.request,parentBranchId:b.id,sourceRunId:null,sourceArtifactId:t.artifacts?.at(-1)?.artifact_id,inputs:artifactForView(t).inputs});
   created.draft=clone(artifactForView(t).inputs);touchDraft(created);created.draftTask=t.id;S.branch=created.id;S.inspectRun=false;S.runSelection=null;S.page='workbench';
  }
  if(a==='task-inputs'){ensurePreparation(b).editingPreparation=true;S.branch=b.id;S.inspectRun=false;S.runSelection=null;S.page='workbench';}
  persist();render();return true;
 }

 const filters=referenceFilters(),runs=filteredReferenceRuns(),runCard=run=>`<article class="reference-option"><div class="reference-preview"><div class="reference-thumbnail">${run.status==='failed'?'<span>×</span>':art(run.art)}</div><div><b>${run.id} · ${esc(run.title)}</b><small>${esc(workLocation(run.work,run.branch))}</small><small>${MODELS[run.inputs.model].short} · ${runMedia(run).length} 张图片</small></div></div><div class="row reference-actions">${btn('添加引用','add-reference',`data-id="${run.id}"`,'small primary')}${btn('使用此运行输入','use-reference',`data-id="${run.id}"`,'small')}</div></article>`;
 if(kind==='task'){
  const filter=modal.filters,tasks=S.tasks.filter(task=>(filter.task==='all'||task.id===filter.task)&&S.works.some(w=>(filter.workspace==='all'||w.workspace===filter.workspace)&&(filter.work==='all'||w.id===filter.work)&&taskRelatedToWork(task,w.id))).slice().reverse();
  return filters+`<div class="reference-options">${tasks.map(task=>`<article class="reference-option"><b>任务 ${task.id} · ${esc(task.title)}</b><div class="reference-origin">${esc(workLocation(task.work,task.branch))}</div>${(task.artifacts||[]).filter(item=>item.artifact.type!=='question').map(item=>`<p>${esc(item.artifact_id)} · ${esc(ARTIFACT_LABELS[item.artifact.type]||'任务产物')}</p>`).join('')||'<p>尚未提交产物。</p>'}${runs.filter(run=>run.task===task.id).map(runCard).join('')}${btn('添加任务引用','add-reference-task',`data-id="${task.id}"`,'small primary')}${btn('查看产物','inspect-reference-task',`data-id="${task.id}"`,'small quiet')}</article>`).join('')||`<p>${referenceEmptyMessage('task')}</p>`}</div>`;
 }

document.addEventListener('submit',event=>{
 if(event.target.dataset.task){event.preventDefault();const t=S.tasks.find(t=>t.id===event.target.dataset.task);if(t.readOnly)return;t.answer=new FormData(event.target).get('answer').trim();(t.answers??=[]).push({question_artifact_id:t.questionArtifactId,answer:t.answer});const b=S.branches.find(b=>b.id===t.branch);if(!t.input.request&&draftMatches(b,t.input.baseline)){b.goal=t.answer;touchDraft(b);t.input.baseline={goal:b.goal,inputs:clone(b.draft)};}t.status='running';t.startedAt=Date.now();t.due=Date.now()+4500;t.phase=0;persist();render();return;}

 if(event.target.id!=='modal-form')return;event.preventDefault();
 if(modal.kind==='function'){
  const old=functionBinding(modal.id),f=templateFormValue(),problem=requestTemplateProblem(f.requestTemplate,f.kind)||agentModelProblem(f.agentModel);

 else if(modal.kind==='evaluate')saveEvaluation(modal.id);
 else if(modal.kind==='reuse')dispatch('reuse',{id:modal.id,model:value('reuse-model'),name:value('reuse-name')});

 if(['review','compare','diagnose','experience'].includes(t.kind)&&!t.input.evaluation&&t.input.evidence[0])t.input.evaluation=evaluationInput(t.input.evidence[0]);
 t.taskInput=taskInput(t);
