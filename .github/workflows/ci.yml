name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install pnpm 11.7.0
        run: corepack install --global pnpm@11.7.0
      - name: Verify pnpm 11.7.0
        run: test "$(pnpm --version)" = "11.7.0"
      - name: Check manifest and lockfile
        run: pnpm run check:manifest-lock
      - name: Audit dependency advisories
        run: pnpm run security:advisories
      - name: Check dependency build scripts
        run: pnpm run security:build-scripts
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Quality
        run: pnpm quality
