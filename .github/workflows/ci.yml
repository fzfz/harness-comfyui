name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Enable pnpm 11.7.0
        run: corepack prepare pnpm@11.7.0 --activate
      - name: Check manifest and lockfile
        run: pnpm run check:manifest-lock
      - name: Audit dependency advisories
        run: pnpm run security:advisories
      - name: Check dependency build scripts
        run: pnpm run security:build-scripts
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Quality
        run: pnpm quality
