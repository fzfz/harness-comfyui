name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Fast quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Disable Corepack pnpm shim
        run: corepack disable pnpm
      - name: Install pnpm 11.7.0
        run: npm install --global pnpm@11.7.0
      - name: Verify pnpm 11.7.0 outside the repository
        run: |
          verification_root="$(mktemp -d)"
          trap 'rm -rf "$verification_root"' EXIT
          mkdir -p "$verification_root/home" "$verification_root/cwd"
          test "$(cd "$verification_root/cwd" && HOME="$verification_root/home" USERPROFILE="$verification_root/home" pnpm --version)" = "11.7.0"
      - name: Run preinstall quality gates
        run: pnpm run quality:preinstall
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Run fast quality gates
        run: pnpm run quality:fast

  impact:
    name: Classify main change impact
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      qualify: ${{ steps.classify.outputs.qualify }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        run: |
          qualify="$(node scripts/ci/classify-changes.mjs --root "$PWD" --before "${{ github.event.before }}" --after "${{ github.sha }}")"
          echo "qualify=$qualify" >> "$GITHUB_OUTPUT"

  qualify:
    name: Artifact qualification
    if: needs.impact.outputs.qualify == 'true'
    needs: [quality, impact]
    uses: ./.github/workflows/deploy.yml
    with:
      commit: ${{ github.sha }}
