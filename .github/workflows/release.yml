name: Release Preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to preview
        required: true
        type: string
      commit:
        description: Exact commit from main to preview
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Fetch origin main for release identity check
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Verify release identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          node --input-type=module -e 'import { assertExpectedIdentity } from "./scripts/release/validate-package.mjs"; assertExpectedIdentity({ expectedVersion: process.env.RELEASE_VERSION, expectedCommit: process.env.RELEASE_COMMIT })'
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Disable Corepack pnpm shim
        run: corepack disable pnpm
      - name: Install pnpm 11.7.0
        run: npm install --global pnpm@11.7.0
      - name: Verify pnpm 11.7.0 outside the repository
        run: |
          verification_root="$(mktemp -d)"
          trap 'rm -rf "$verification_root"' EXIT
          mkdir -p "$verification_root/home" "$verification_root/cwd"
          test "$(cd "$verification_root/cwd" && HOME="$verification_root/home" USERPROFILE="$verification_root/home" pnpm --version)" = "11.7.0"
      - name: Check manifest and lockfile
        run: pnpm run check:manifest-lock
      - name: Audit dependency advisories
        run: pnpm run security:advisories
      - name: Check dependency build scripts
        run: pnpm run security:build-scripts
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Quality
        run: pnpm quality
      - name: Release Preview
        run: node scripts/release/preview.mjs --expected-version "${{ inputs.version }}" --expected-commit "${{ inputs.commit }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Release Preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: |
            .release/quality/artifact.json
            .release/quality/*.tgz
          if-no-files-found: error
