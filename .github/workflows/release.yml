name: Release Preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to preview
        required: true
        type: string
      commit:
        description: Exact commit from main to preview
        required: true
        type: string
      qualification_run_id:
        description: Workflow run ID that produced the qualified artifact
        required: true
        type: string
      artifact_sha256:
        description: SHA-256 identity of the qualified tarball
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  release-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Fetch origin main for release identity check
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Verify release identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          node --input-type=module -e 'import { assertExpectedIdentity } from "./scripts/release/validate-package.mjs"; assertExpectedIdentity({ expectedVersion: process.env.RELEASE_VERSION, expectedCommit: process.env.RELEASE_COMMIT })'
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Download qualified artifact from the qualification run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-qualified
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ github.token }}
          path: .
      - name: Relocate qualified manifest
        run: node scripts/ci/artifact-qualification.mjs relocate --root "$PWD"
      - name: Validate qualified artifact identity
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
          EXPECTED_RUN_ID: ${{ inputs.qualification_run_id }}
          EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
        run: node scripts/ci/artifact-qualification.mjs validate --root "$PWD" --expected-version "$EXPECTED_VERSION" --expected-commit "$EXPECTED_COMMIT" --expected-run-id "$EXPECTED_RUN_ID" --expected-sha256 "$EXPECTED_SHA256"
      - name: Release Preview
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          set -o pipefail
          node scripts/release/preview.mjs --expected-version "$RELEASE_VERSION" --expected-commit "$RELEASE_COMMIT" | tee .release/quality/release-preview.txt | tee "$GITHUB_STEP_SUMMARY"
      - name: Upload Release Preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-preview
          path: |
            .release/quality/artifact.json
            .release/quality/*.tgz
            .release/quality/qualification.json
            .release/quality/release-preview.txt
          include-hidden-files: true
          if-no-files-found: error
