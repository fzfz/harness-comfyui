name: Artifact Qualification

on:
  workflow_call:
    inputs:
      commit:
        description: Exact commit to qualify
        required: true
        type: string
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit to qualify
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Build candidate artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Verify exact qualification commit
        env:
          QUALIFICATION_COMMIT: ${{ inputs.commit }}
        run: |
          node --input-type=module -e 'const commit = process.env.QUALIFICATION_COMMIT; if (!/^[0-9a-f]{40}$/u.test(commit ?? "")) throw new Error("qualification commit must be lowercase 40-character hex")'
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_COMMIT"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Disable Corepack pnpm shim
        run: corepack disable pnpm
      - name: Install pnpm 11.7.0
        run: npm install --global pnpm@11.7.0
      - name: Verify pnpm 11.7.0 outside the repository
        run: |
          verification_root="$(mktemp -d)"
          trap 'rm -rf "$verification_root"' EXIT
          mkdir -p "$verification_root/home" "$verification_root/cwd"
          test "$(cd "$verification_root/cwd" && HOME="$verification_root/home" USERPROFILE="$verification_root/home" pnpm --version)" = "11.7.0"
      - name: Run preinstall quality gates
        run: pnpm run quality:preinstall
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Run fast quality gates for manual qualification
        if: github.event_name == 'workflow_dispatch'
        run: pnpm run quality:fast
      - name: Build candidate
        if: github.event_name != 'workflow_dispatch'
        run: pnpm run build
      - name: Pack candidate artifact
        run: pnpm run package:pack
      - name: Validate candidate artifact
        run: pnpm run package:validate
      - name: Upload quality candidate
        uses: actions/upload-artifact@v4
        with:
          name: quality-candidate
          path: |
            .release/quality/artifact.json
            .release/quality/*.tgz
            lib/**
          include-hidden-files: true
          if-no-files-found: error

  deploy-lifecycle:
    name: Deploy lifecycle qualification
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Disable Corepack pnpm shim
        run: corepack disable pnpm
      - name: Install pnpm 11.7.0
        run: npm install --global pnpm@11.7.0
      - name: Verify pnpm 11.7.0 outside the repository
        run: |
          verification_root="$(mktemp -d)"
          trap 'rm -rf "$verification_root"' EXIT
          mkdir -p "$verification_root/home" "$verification_root/cwd"
          test "$(cd "$verification_root/cwd" && HOME="$verification_root/home" USERPROFILE="$verification_root/home" pnpm --version)" = "11.7.0"
      - name: Run preinstall quality gates
        run: pnpm run quality:preinstall
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Download quality candidate
        uses: actions/download-artifact@v4
        with:
          name: quality-candidate
          path: .
      - name: Relocate candidate manifest
        run: node scripts/ci/artifact-qualification.mjs relocate --root "$PWD"
      - name: Run deploy lifecycle gate
        run: pnpm test:deploy

  composition:
    name: Composition qualification
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Disable Corepack pnpm shim
        run: corepack disable pnpm
      - name: Install pnpm 11.7.0
        run: npm install --global pnpm@11.7.0
      - name: Verify pnpm 11.7.0 outside the repository
        run: |
          verification_root="$(mktemp -d)"
          trap 'rm -rf "$verification_root"' EXIT
          mkdir -p "$verification_root/home" "$verification_root/cwd"
          test "$(cd "$verification_root/cwd" && HOME="$verification_root/home" USERPROFILE="$verification_root/home" pnpm --version)" = "11.7.0"
      - name: Run preinstall quality gates
        run: pnpm run quality:preinstall
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Download quality candidate
        uses: actions/download-artifact@v4
        with:
          name: quality-candidate
          path: .
      - name: Relocate candidate manifest
        run: node scripts/ci/artifact-qualification.mjs relocate --root "$PWD"
      - name: Run composition gate
        run: pnpm test:composition

  browser-e2e:
    name: Browser E2E qualification
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Disable Corepack pnpm shim
        run: corepack disable pnpm
      - name: Install pnpm 11.7.0
        run: npm install --global pnpm@11.7.0
      - name: Verify pnpm 11.7.0 outside the repository
        run: |
          verification_root="$(mktemp -d)"
          trap 'rm -rf "$verification_root"' EXIT
          mkdir -p "$verification_root/home" "$verification_root/cwd"
          test "$(cd "$verification_root/cwd" && HOME="$verification_root/home" USERPROFILE="$verification_root/home" pnpm --version)" = "11.7.0"
      - name: Run preinstall quality gates
        run: pnpm run quality:preinstall
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Download quality candidate
        uses: actions/download-artifact@v4
        with:
          name: quality-candidate
          path: .
      - name: Relocate candidate manifest
        run: node scripts/ci/artifact-qualification.mjs relocate --root "$PWD"
      - name: Run browser E2E gate
        run: pnpm test:e2e

  release-smoke:
    name: Release smoke qualification
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Disable Corepack pnpm shim
        run: corepack disable pnpm
      - name: Install pnpm 11.7.0
        run: npm install --global pnpm@11.7.0
      - name: Verify pnpm 11.7.0 outside the repository
        run: |
          verification_root="$(mktemp -d)"
          trap 'rm -rf "$verification_root"' EXIT
          mkdir -p "$verification_root/home" "$verification_root/cwd"
          test "$(cd "$verification_root/cwd" && HOME="$verification_root/home" USERPROFILE="$verification_root/home" pnpm --version)" = "11.7.0"
      - name: Run preinstall quality gates
        run: pnpm run quality:preinstall
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Download quality candidate
        uses: actions/download-artifact@v4
        with:
          name: quality-candidate
          path: .
      - name: Relocate candidate manifest
        run: node scripts/ci/artifact-qualification.mjs relocate --root "$PWD"
      - name: Run release smoke gate
        run: pnpm run release:smoke

  qualification:
    name: Write qualification record
    needs: [deploy-lifecycle, composition, browser-e2e, release-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Download quality candidate
        uses: actions/download-artifact@v4
        with:
          name: quality-candidate
          path: .
      - name: Relocate candidate manifest
        run: node scripts/ci/artifact-qualification.mjs relocate --root "$PWD"
      - name: Read candidate identity
        id: artifact
        run: |
          version="$(node --input-type=module -e "import fs from 'node:fs'; const artifact = JSON.parse(fs.readFileSync('.release/quality/artifact.json', 'utf8')); process.stdout.write(artifact.version)")"
          sha256="$(node --input-type=module -e "import fs from 'node:fs'; const artifact = JSON.parse(fs.readFileSync('.release/quality/artifact.json', 'utf8')); process.stdout.write(artifact.sha256)")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - name: Write qualification record
        env:
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
          QUALIFICATION_COMMIT: ${{ inputs.commit }}
        run: node scripts/ci/artifact-qualification.mjs write --root "$PWD" --run-id "$QUALIFICATION_RUN_ID" --commit "$QUALIFICATION_COMMIT"
      - name: Validate qualification record
        env:
          EXPECTED_VERSION: ${{ steps.artifact.outputs.version }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: node scripts/ci/artifact-qualification.mjs validate --root "$PWD" --expected-version "$EXPECTED_VERSION" --expected-commit "$EXPECTED_COMMIT" --expected-run-id "$EXPECTED_RUN_ID" --expected-sha256 "$EXPECTED_SHA256"
      - name: Upload qualified artifact
        uses: actions/upload-artifact@v4
        with:
          name: quality-qualified
          path: |
            .release/quality/artifact.json
            .release/quality/*.tgz
            .release/quality/qualification.json
            lib/**
          include-hidden-files: true
          if-no-files-found: error
