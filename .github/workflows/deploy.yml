name: Deploy Lifecycle Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Disable Corepack pnpm shim
        run: corepack disable pnpm
      - name: Install pnpm 11.7.0
        run: npm install --global pnpm@11.7.0
      - name: Verify pnpm 11.7.0 outside the repository
        run: |
          verification_root="$(mktemp -d)"
          trap 'rm -rf "$verification_root"' EXIT
          mkdir -p "$verification_root/home" "$verification_root/cwd"
          test "$(cd "$verification_root/cwd" && HOME="$verification_root/home" USERPROFILE="$verification_root/home" pnpm --version)" = "11.7.0"
      - name: Check manifest and lockfile
        run: pnpm run check:manifest-lock
      - name: Audit dependency advisories
        run: pnpm run security:advisories
      - name: Check dependency build scripts
        run: pnpm run security:build-scripts
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Build product
        run: pnpm run build
      - name: Pack shared .release/quality/artifact.json
        run: pnpm run package:pack
      - name: Validate shared .release/quality/artifact.json
        run: pnpm run package:validate
      - name: Deploy lifecycle tests using .release/quality/artifact.json
        run: pnpm test:deploy
