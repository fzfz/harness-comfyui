      - id: project-skill-scope
        name: cordis:group
        group: true
        isolate:
          skills: true
        config:
          - id: skills
            name: '@deepseek-ai/dsh-skill'
          - id: composition
            name: cordis:include
            config:
              path: ./harness-comfyui-iteration/agent.cordis.yml
