    id: harness-comfyui-cli-candidate
    name: ComfyUI工作台预设
    order: 91
    plugins:
      - id: project-skill-scope
        name: cordis:group
        group: true
        isolate:
          skills: true
        config:
          - id: skills
            name: '@deepseek-ai/dsh-skill'
          - id: composition
            name: cordis:include
            config:
              path: ./harness-comfyui-cli-candidate/agent.cordis.yml

- id: preset-harness-comfyui-iteration
  name: '@deepseek-ai/dsh-agent-preset'
