- id: project-common
  name: cordis:include
  config:
    path: ../shared/agent.cordis.yml
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are the main Agent for the user's ComfyUI task. Select and read the project Skill whose description
      matches the user's request, and follow that Skill's task scope and deliverable requirements. When the
      request matches the description of comfyui-iterate-generation, use that Skill to dispatch composition,
      generation, independent observation and comparison. For that iteration task, assign the concrete input
      and output file paths using the Skill's records reference, read completed results and pass the relevant
      files to the next task. Keep the image goal and essential elements throughout prompt revisions. Handle
      missing inputs and user choices according to the handoff rules in comfyui-iterate-generation. Deliver
      the image and supporting comparison findings when the comparison confirms that the same image satisfies
      the image goal, essential elements and user requirements. Reply in the user's language.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
- id: composition-agent
  name: ../project-iteration-dispatch.mjs
  config:
    provider: spawn
    toolName: subagent_composition
    description: 向构图 Agent 派发任务。
    parameters:
      type: object
      properties:
        description:
          type: string
          description: 本次任务的简短名称。
        agent_id:
          type: string
          description: 继续任务时填写原 subagentId；首次创建时省略。
        requirements:
          type: array
          items:
            type: string
          description: 用户要求和本次新增要求；保留原意。
        input_files:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
                description: 需要读取的文件或目录完整路径。
              purpose:
                type: string
                description: 该材料是什么。
            required:
              - path
              - purpose
            additionalProperties: false
          description: 本次需要读取的故事、人物材料及构图修正所需反馈。
        reference_files:
          type: array
          items:
            type: string
          description: 构图 Agent 参考文档的完整路径。
        output_files:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
                description: 父 Agent 指定的输出文件完整路径。
              purpose:
                type: string
                description: 该文件需要保存的结果内容。
            required:
              - path
              - purpose
            additionalProperties: false
          description: 本次需要写入的结果文件。
      required:
        - description
        - requirements
        - input_files
        - reference_files
        - output_files
      additionalProperties: false
    taskTemplate:
      title: 构图任务
      sections:
        - heading: 本次任务名称
          fields:
            - description
        - heading: 本次要求
          fields:
            - requirements
        - heading: 需要读取的材料与参考
          fields:
            - input_files
            - reference_files
        - heading: 需要写入的结果文件
          fields:
            - output_files
    maxDepth: 1
    agentOptions:
      provider: openrouter
      model: deepseek/deepseek-v4-flash-0731
    agentPreset: harness-comfyui-composition
- id: generation-agent
  name: ../project-iteration-dispatch.mjs
  config:
    provider: spawn
    toolName: subagent_generation
    description: 向生成 Agent 派发任务。
    parameters:
      type: object
      properties:
        description:
          type: string
          description: 本次任务的简短名称。
        agent_id:
          type: string
          description: 继续任务时填写原 subagentId；首次创建时省略。
        requirements:
          type: array
          items:
            type: string
          description: 用户要求和本次新增要求；保留原意。
        input_files:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
                description: 需要读取的文件或目录完整路径。
              purpose:
                type: string
                description: 该材料是什么。
            required:
              - path
              - purpose
            additionalProperties: false
          description: 本次构图文件、此前比较结果、生成记录和 Builder JSON 文件。
        reference_files:
          type: array
          items:
            type: string
          description: 生成 Agent 参考文档的完整路径。
        output_files:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
                description: 父 Agent 指定的输出文件完整路径。
              purpose:
                type: string
                description: 该文件需要保存的结果内容。
            required:
              - path
              - purpose
            additionalProperties: false
          description: 本次需要写入的结果文件。
        supplied_data:
          type: string
          description: 已选 Workflow、模型、LoRA 信息，或子 Agent 请求在消息中接收的完整 Builder JSON 原文。
      required:
        - description
        - requirements
        - input_files
        - reference_files
        - output_files
      additionalProperties: false
    taskTemplate:
      title: 生成任务
      sections:
        - heading: 本次任务名称
          fields:
            - description
        - heading: 本次要求
          fields:
            - requirements
        - heading: 需要读取的材料与参考
          fields:
            - input_files
            - reference_files
        - heading: 本次提供的生成数据
          fields:
            - supplied_data
        - heading: 需要写入的结果文件
          fields:
            - output_files
    maxDepth: 1
    agentOptions:
      provider: openrouter
      model: deepseek/deepseek-v4-flash-0731
    agentPreset: harness-comfyui-generation
- id: observation-agent
  name: ../project-observation-dispatch.mjs
  config:
    provider: spawn
    toolName: subagent_observation
    description: 向观察 Agent 派发任务。
    parameters:
      type: object
      properties:
        description:
          type: string
          description: 本次任务的简短名称。
        agent_id:
          type: string
          description: 继续任务时填写原 subagentId；首次创建时省略。
        output_files:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
                description: 父 Agent 指定的输出文件完整路径。
              purpose:
                type: string
                description: 该文件需要保存的结果内容。
            required:
              - path
              - purpose
            additionalProperties: false
          description: 本次需要写入的结果文件。
        images:
          type: array
          items:
            type: object
            properties:
              media_id:
                type: string
                description: 该生成记录中需要观察的媒体 ID。
              run_id:
                type: string
                description: 该图片所属生成记录的 Run ID。
            required:
              - media_id
              - run_id
            additionalProperties: false
          description: 需要独立观察的实际图片。
        observation:
          description: 首轮使用 initial；补充观察使用 supplement，并列出比较时缺少的可见事实。
          oneOf:
            - type: object
              properties:
                mode:
                  type: string
                  const: initial
              required:
                - mode
              additionalProperties: false
            - type: object
              properties:
                mode:
                  type: string
                  const: supplement
                missing_facts:
                  type: array
                  items:
                    type: string
                  description: 比较尚缺的可见事实，由观察 Agent 转为中性问题。
              required:
                - mode
                - missing_facts
              additionalProperties: false
      required:
        - description
        - output_files
        - images
        - observation
      additionalProperties: false
    taskTemplate:
      title: 观察任务
      sections:
        - heading: 本次任务名称
          fields:
            - description
        - heading: 需要观察的图片与问题
          fields:
            - images
            - observation
        - heading: 需要写入的结果文件
          fields:
            - output_files
    maxDepth: 1
    agentOptions:
      provider: openrouter
      model: deepseek/deepseek-v4-flash-0731
    agentPreset: harness-comfyui-observation
