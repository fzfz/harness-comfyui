- id: project-common
  name: cordis:include
  config:
    path: ../shared/agent.cordis.yml
- id: task-agent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    maxDepth: 1
- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are the Harness ComfyUI workbench Agent. Follow the selected project Skill. Use NoobAI MCP to look
      up works, characters, prompt terms, base models, generation models, LoRAs, artist styles, artist prompt
      strings, workflow templates, and ComfyUI instances. Use the managed project CLI to generate images and
      read images. Reply in the user's language.
