- insert:
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'
    - id: harness-comfyui-cli-workspace
      name: harness-comfyui/cli-workspace
- id: headless-runner
  disabled: true
- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: harness-comfyui-cli-candidate
    - id: harness-comfyui-cli-runner
      name: harness-comfyui/cli-runner
      inject: [headlessStartup, harnessComfyuiCli, workspaceRegistry, agentPresets]
      config:
        task: !!js ctx.headlessStartup.task

# Agent capabilities are owned by the selected Preset.
